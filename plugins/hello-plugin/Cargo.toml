[package]
name = "gens-hello-plugin"
description = "Out-of-tree proof of the Gens plugin API (Phase 9, ADR-0032): a downstream crate extending a running world"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salim77007j/gens"
publish = false

[dependencies]
gens-plugin = { path = "../../crates/gens-plugin", version = "0.1.0" }
gens-ecs = { path = "../../crates/gens-ecs", version = "0.1.0" }
gens-math = { path = "../../crates/gens-math", version = "0.1.0" }
bevy_ecs = "0.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
