[package]
name = "gens-profiler"
description = "Profiling, memory tracking and benchmarks (observation-only, Phase 8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Workspace lints, EXCEPT unsafe_code: the memory module implements
# GlobalAlloc, an `unsafe trait` whose methods are `unsafe fn` by
# definition — a tracking allocator cannot exist without `unsafe`.
# Containment: unsafe appears ONLY in memory.rs, every block carries a
# SAFETY comment, and the crate still forbids unsafe_op_in_unsafe_fn
# (lib.rs) so every unsafe op is an explicit, reviewable block.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
