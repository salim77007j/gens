name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Gate 1: process integrity (active from Phase 0)
  # ------------------------------------------------------------------
  docs-gate:
    name: gate / docs integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Governance docs present
        run: |
          set -eu
          missing=0
          for f in docs/WORKLOG.md docs/DECISIONS.md docs/RISKS.md docs/ROLLBACK_PLAN.md docs/EXPERIMENTS.md; do
            if [ ! -f "$f" ]; then
              echo "::error::missing governance doc: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Secret scan (tracked files)
        run: |
          set -eu
          # GitHub credential token patterns must never appear in tracked content.
          if git grep -nE 'gh[pousr]_[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::possible GitHub credential committed — see docs/ROLLBACK_PLAN.md section 5"
            exit 1
          fi
          echo "secret scan: clean"

  # ------------------------------------------------------------------
  # Gate 2: Rust quality gates (armed in Phase 0, active from Phase 1
  # when the Cargo workspace exists — steps self-detect and skip cleanly)
  # ------------------------------------------------------------------
  rust-gates:
    name: gates / ${{ matrix.os }}
    needs: docs-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect Cargo workspace
        id: detect
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo workspace yet (Phase 0): Rust gates armed, not active."
          fi

      - name: Install Rust toolchain
        if: steps.detect.outputs.active == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        if: steps.detect.outputs.active == 'true'
        uses: Swatinem/rust-cache@v2

      # ADR-0011: guarantee a software Vulkan device on Linux (lavapipe)
      # so GPU rendering and #[ignore]d GPU tests really execute in CI.
      - name: Install software Vulkan driver (Linux)
        if: steps.detect.outputs.active == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          # ICD auto-discovery from /usr/share/vulkan/icd.d; print the probe
          # as run-log evidence of which adapter CI actually renders with.
          ls /usr/share/vulkan/icd.d/ || true
          vulkaninfo --summary 2>/dev/null | head -30 || echo "vulkaninfo unavailable (non-fatal)"

      - name: Format check
        if: steps.detect.outputs.active == 'true'
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        if: steps.detect.outputs.active == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (workspace)
        if: steps.detect.outputs.active == 'true'
        run: cargo build --workspace --all-targets

      - name: Tests (unit)
        if: steps.detect.outputs.active == 'true'
        run: cargo test --workspace

      - name: Tests (GPU integration, real adapter required)
        if: steps.detect.outputs.active == 'true' && runner.os != 'Windows'
        run: |
          # Executes the #[ignore]d renderer tests. Linux uses lavapipe
          # (installed above); macOS uses the runner's Metal device.
          cargo test --workspace -- --ignored

      - name: Headless CPU smoke (engine loop + ECS, no GPU)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          cargo run -p gens-runtime --example hello_world -- --frames 60 --out smoke_cpu.png
          test -f smoke_cpu.png
          echo "cpu smoke snapshot: $(wc -c < smoke_cpu.png) bytes"

      - name: Headless physics smoke (input -> physics -> ECS, no GPU)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only by design: deterministic replay runs bit-identically on
          # all three operating systems (R-013 in-process determinism).
          cargo run -p gens-runtime --example physics_hello -- --steps 600 --out smoke_physics.json
          test -f smoke_physics.json
          echo "physics smoke trajectory: $(wc -c < smoke_physics.json) bytes"

      - name: Headless GPU smoke (wgpu offscreen render + PNG)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # Linux/macOS: must render for real (no skip flag — ADR-0011).
          # Windows: best effort; prints GPU-SKIP when no adapter exists.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo run -p gens-runtime --example gpu_hello -- --frames 60 --out smoke_gpu.png --allow-no-gpu
            if [ -f smoke_gpu.png ]; then
              echo "gpu smoke snapshot: $(wc -c < smoke_gpu.png) bytes"
            else
              echo "GPU-SKIP: Windows runner had no usable adapter this run (documented in the phase report)"
            fi
          else
            cargo run -p gens-runtime --example gpu_hello -- --frames 60 --out smoke_gpu.png
            test -f smoke_gpu.png
            echo "gpu smoke snapshot: $(wc -c < smoke_gpu.png) bytes"
          fi

      - name: Upload smoke artifacts
        if: steps.detect.outputs.active == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-snapshots
          path: |
            smoke_cpu.png
            smoke_gpu.png
            smoke_physics.json

      - name: Binary size gate
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # ADR-0012: gate = 350 MiB on the debug gpu_hello binary — 2x the
          # measured 171.3 MiB baseline (wgpu-linked, Linux x86_64).
          LIMIT_BYTES=$((350 * 1024 * 1024))
          cargo build -p gens-runtime --example gpu_hello
          SIZE=$(wc -c < target/debug/examples/gpu_hello)
          echo "gpu_hello debug binary: $SIZE bytes (limit $LIMIT_BYTES)"
          if [ "$SIZE" -gt "$LIMIT_BYTES" ]; then
            echo "::error::binary size gate failed: $SIZE > $LIMIT_BYTES"
            exit 1
          fi
