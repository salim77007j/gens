name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Gate 1: process integrity (active from Phase 0)
  # ------------------------------------------------------------------
  docs-gate:
    name: gate / docs integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Governance docs present
        run: |
          set -eu
          missing=0
          for f in docs/WORKLOG.md docs/DECISIONS.md docs/RISKS.md docs/ROLLBACK_PLAN.md docs/EXPERIMENTS.md; do
            if [ ! -f "$f" ]; then
              echo "::error::missing governance doc: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Secret scan (tracked files)
        run: |
          set -eu
          # GitHub credential token patterns must never appear in tracked content.
          if git grep -nE 'gh[pousr]_[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::possible GitHub credential committed — see docs/ROLLBACK_PLAN.md section 5"
            exit 1
          fi
          echo "secret scan: clean"

  # ------------------------------------------------------------------
  # Gate 2: Rust quality gates (armed in Phase 0, active from Phase 1
  # when the Cargo workspace exists — steps self-detect and skip cleanly)
  # ------------------------------------------------------------------
  rust-gates:
    name: gates / ${{ matrix.os }}
    needs: docs-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect Cargo workspace
        id: detect
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo workspace yet (Phase 0): Rust gates armed, not active."
          fi

      - name: Install Rust toolchain
        if: steps.detect.outputs.active == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        if: steps.detect.outputs.active == 'true'
        uses: Swatinem/rust-cache@v2

      # ADR-0011: guarantee a software Vulkan device on Linux (lavapipe)
      # so GPU rendering and #[ignore]d GPU tests really execute in CI.
      - name: Install software Vulkan driver (Linux)
        if: steps.detect.outputs.active == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          # ICD auto-discovery from /usr/share/vulkan/icd.d; print the probe
          # as run-log evidence of which adapter CI actually renders with.
          ls /usr/share/vulkan/icd.d/ || true
          vulkaninfo --summary 2>/dev/null | head -30 || echo "vulkaninfo unavailable (non-fatal)"

      - name: Format check
        if: steps.detect.outputs.active == 'true'
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        if: steps.detect.outputs.active == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (workspace)
        if: steps.detect.outputs.active == 'true'
        run: cargo build --workspace --all-targets

      - name: Tests (unit)
        if: steps.detect.outputs.active == 'true'
        run: cargo test --workspace

      - name: Tests (GPU integration, real adapter required)
        if: steps.detect.outputs.active == 'true' && runner.os != 'Windows'
        run: |
          # Executes the #[ignore]d renderer tests. Linux uses lavapipe
          # (installed above); macOS uses the runner's Metal device.
          cargo test --workspace -- --ignored

      - name: Headless CPU smoke (engine loop + ECS, no GPU)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          cargo run -p gens-runtime --example hello_world -- --frames 60 --out smoke_cpu.png
          test -f smoke_cpu.png
          echo "cpu smoke snapshot: $(wc -c < smoke_cpu.png) bytes"

      - name: Headless physics smoke (input -> physics -> ECS, no GPU)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only by design: deterministic replay runs bit-identically on
          # all three operating systems (R-013 in-process determinism).
          cargo run -p gens-runtime --example physics_hello -- --steps 600 --out smoke_physics.json
          test -f smoke_physics.json
          echo "physics smoke trajectory: $(wc -c < smoke_physics.json) bytes"

      - name: Headless animation+AI+UI smoke (BT -> animation -> ECS -> egui layout)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only by design: BT decisions, animation sampling and egui
          # tessellation are pure; two runs must replay bit-identically
          # (R-013 in-process determinism, same as the physics smoke).
          cargo run -p gens-runtime --example animate_hello -- --steps 900 --out smoke_animate.json
          test -f smoke_animate.json
          echo "animate smoke trajectory: $(wc -c < smoke_animate.json) bytes"

      - name: Headless assets+scripting+save smoke (glTF import -> Rhai script -> save/load replay)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only by design: glTF import, sandboxed Rhai decisions and
          # save/load are pure; the save/load continuation must replay
          # bit-identically against the straight-through run (R-013).
          cargo run -p gens-runtime --example asset_script_hello -- --steps 1200 --out smoke_asset_script.json
          test -f smoke_asset_script.json
          echo "asset+script smoke evidence: $(wc -c < smoke_asset_script.json) bytes"

      - name: Headless networking smoke (data document -> QUIC session -> world replication)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only by design: the QUIC endpoints talk over 127.0.0.1
          # with in-memory self-signed certs (no external network); the
          # replicated snapshot's continuation must replay bit-identically
          # against the host's uninterrupted run (R-013).
          cargo run -p gens-runtime --example net_hello -- --steps 600 --replicate-at 300 --out smoke_net.json
          test -f smoke_net.json
          echo "net smoke evidence: $(wc -c < smoke_net.json) bytes"

      - name: Headless GPU smoke (wgpu offscreen render + PNG)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # Linux/macOS: must render for real (no skip flag — ADR-0011).
          # Windows: best effort; prints GPU-SKIP when no adapter exists.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo run -p gens-runtime --example gpu_hello -- --frames 60 --out smoke_gpu.png --allow-no-gpu
            if [ -f smoke_gpu.png ]; then
              echo "gpu smoke snapshot: $(wc -c < smoke_gpu.png) bytes"
            else
              echo "GPU-SKIP: Windows runner had no usable adapter this run (documented in the phase report)"
            fi
          else
            cargo run -p gens-runtime --example gpu_hello -- --frames 60 --out smoke_gpu.png
            test -f smoke_gpu.png
            echo "gpu smoke snapshot: $(wc -c < smoke_gpu.png) bytes"
          fi

      - name: Headless editor smoke (full editor UI + viewport render + determinism)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # The editor is GPU-bound everywhere: Linux (lavapipe) and macOS
          # (Metal) must render for real; Windows is best-effort like the
          # GPU smoke (adapter presence varies by runner image).
          if [ "$RUNNER_OS" = "Windows" ]; then
            if cargo run -p gens-editor --example editor_hello -- --steps 24 --out smoke_editor; then
              test -f smoke_editor.png
              echo "editor smoke snapshot: $(wc -c < smoke_editor.png) bytes"
            else
              echo "EDITOR-SKIP: Windows runner had no usable adapter this run (documented in the phase report)"
            fi
          else
            cargo run -p gens-editor --example editor_hello -- --steps 24 --out smoke_editor
            test -f smoke_editor.png
            test -f smoke_editor.json
            echo "editor smoke snapshot: $(wc -c < smoke_editor.png) bytes"
          fi

      - name: Headless profiler smoke (ADR-0027 observation-only proof + phase timings + memory)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only: the same physics replay runs profiler-off and
          # profiler-on; all per-step world-state hashes must match
          # byte-for-byte (the per-integration proof ADR-0027 demands).
          cargo run -p gens-runtime --example profile_hello -- --steps 600 --out smoke_profile.json
          test -f smoke_profile.json
          echo "profiler smoke evidence: $(wc -c < smoke_profile.json) bytes"

      - name: Headless cinematic smoke (ADR-0030 replay + seek-equivalence proof)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only: three runs (straight-through, fresh replay,
          # seek-resume to the exact internal time) must produce identical
          # per-step world hashes — the ADR-0030 per-integration proof.
          cargo run -p gens-runtime --example cinematic_hello -- --steps 300 --out smoke_cinematic.json
          test -f smoke_cinematic.json
          echo "cinematic smoke evidence: $(wc -c < smoke_cinematic.json) bytes"

      - name: Headless worldgen smoke (ADR-0031 order/streaming/restart proofs)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only: chunk generation is a pure function of (seed, coord);
          # the streaming walk crosses a chunk boundary and the whole run
          # must replay identically through the ECS.
          cargo run -p gens-runtime --example worldgen_hello -- --steps 300 --out smoke_worldgen.json
          test -f smoke_worldgen.json
          echo "worldgen smoke evidence: $(wc -c < smoke_worldgen.json) bytes"

      - name: Out-of-tree plugin smoke (ADR-0032 downstream proof)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # The proof crate lives OUTSIDE the workspace and path-depends
          # on the engine crates like any downstream user; CARGO_TARGET_DIR
          # shares the workspace target (R-032 disk discipline). If this
          # step cannot build, the plugin API is broken — a CI gate.
          cd plugins/hello-plugin
          cargo run --bin hello-plugin-demo -- --frames 120 --out ../../smoke_plugin.json
          test -f ../../smoke_plugin.json
          echo "plugin smoke evidence: $(wc -c < ../../smoke_plugin.json) bytes"

      - name: Headless build-pipeline smoke (package build -> verify -> player run)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # CPU-only export story: GENSPKG1 built from an in-memory scene +
          # script, every hash verified, 300 deterministic player steps,
          # world validated clean. Also proves the gens-player/gens-pkg
          # bins link on all three OSes.
          cargo run -p gens-build --example package_hello -- --steps 300 --out smoke_package.json
          test -f smoke_package.json
          echo "package smoke evidence: $(wc -c < smoke_package.json) bytes"

      - name: Headless bench smoke (environment-disclosed step timings)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # Small sample count: this is a smoke (does the bench run and
          # produce a complete report on all OSes), not the benchmark
          # itself; advisory numbers per ADR-0029.
          cargo run -p gens-runtime --example bench_step -- --samples 6 --steps-per-sample 40 --warmup 2 --out smoke_bench.json
          test -f smoke_bench.json
          echo "bench smoke evidence: $(wc -c < smoke_bench.json) bytes"

      - name: Final validation manifest (gens-release-1, self-validating)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # The manifest validates its own shape (crate set, ADR ledger,
          # risk register, roadmap rows, wire-format inventory) and fails
          # the run on any discrepancy - row 10 "validation".
          cargo run -p gens-build --example release_manifest -- --out smoke_release_manifest.json
          test -f smoke_release_manifest.json
          echo "release manifest: $(wc -c < smoke_release_manifest.json) bytes"

      - name: Upload smoke artifacts
        if: steps.detect.outputs.active == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-snapshots
          path: |
            smoke_cpu.png
            smoke_gpu.png
            smoke_physics.json
            smoke_animate.json
            smoke_asset_script.json
            smoke_net.json
            smoke_editor.png
            smoke_editor.json
            smoke_profile.json
            smoke_cinematic.json
            smoke_worldgen.json
            smoke_plugin.json
            smoke_package.json
            smoke_bench.json
            smoke_release_manifest.json

      - name: Binary size gates (debug + release)
        if: steps.detect.outputs.active == 'true'
        shell: bash
        run: |
          # ADR-0012 (Phase 2, re-baselined Phase 8): debug gate 350 MiB on
          # the gpu_hello binary; the dev profile moved to line-tables-only
          # debuginfo in Phase 8 (measured 170.1 MiB, limit unchanged).
          # ADR-0029 (Phase 8): release gate 20 MiB on the thin-LTO release
          # binary (measured 8.3 MiB, Linux x86_64).
          LIMIT_BYTES=$((350 * 1024 * 1024))
          cargo build -p gens-runtime --example gpu_hello
          SIZE=$(wc -c < target/debug/examples/gpu_hello)
          echo "gpu_hello debug binary: $SIZE bytes (limit $LIMIT_BYTES)"
          if [ "$SIZE" -gt "$LIMIT_BYTES" ]; then
            echo "::error::debug size gate failed: $SIZE > $LIMIT_BYTES"
            exit 1
          fi
          RELEASE_LIMIT_BYTES=$((20 * 1024 * 1024))
          cargo build --release -p gens-runtime --example gpu_hello
          RELEASE_SIZE=$(wc -c < target/release/examples/gpu_hello)
          echo "gpu_hello release binary: $RELEASE_SIZE bytes (limit $RELEASE_LIMIT_BYTES)"
          if [ "$RELEASE_SIZE" -gt "$RELEASE_LIMIT_BYTES" ]; then
            echo "::error::release size gate failed: $RELEASE_SIZE > $RELEASE_LIMIT_BYTES"
            exit 1
          fi
