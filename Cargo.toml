[workspace]
resolver = "3"
members = [
    "crates/gens-core",
    "crates/gens-ecs",
    "crates/gens-math",
    "crates/gens-renderer",
    "crates/gens-physics",
    "crates/gens-audio",
    "crates/gens-input",
    "crates/gens-animation",
    "crates/gens-ui",
    "crates/gens-ai",
    "crates/gens-scripting",
    "crates/gens-assets",
    "crates/gens-networking",
    "crates/gens-editor",
    "crates/gens-runtime",
    "crates/gens-profiler",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/salim77007j/gens"
authors = ["The Gens Engine Authors"]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
bevy_ecs = "0.20.0"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glam = { version = "0.34.1", features = ["serde"] }
wgpu = "30.0.1"
pollster = "1"
rapier3d = "0.36.1"
kira = { version = "0.12.5", default-features = false }
egui = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rhai = { version = "1.26.1", default-features = false, features = ["std", "sync"] }
gltf = "1.4.1"
# Phase 6 (networking + data assets): QUIC transport stack.
# Async is confined to gens-networking internals (sync facade for the engine,
# ADR-0022); the runtime is current_thread and owned by the endpoint.
tokio = { version = "1.53.2", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }

gens-core = { path = "crates/gens-core", version = "0.1.0" }
gens-ecs = { path = "crates/gens-ecs", version = "0.1.0" }
gens-math = { path = "crates/gens-math", version = "0.1.0" }
gens-renderer = { path = "crates/gens-renderer", version = "0.1.0" }
gens-physics = { path = "crates/gens-physics", version = "0.1.0" }
gens-input = { path = "crates/gens-input", version = "0.1.0" }
gens-audio = { path = "crates/gens-audio", version = "0.1.0" }
gens-animation = { path = "crates/gens-animation", version = "0.1.0" }
gens-ui = { path = "crates/gens-ui", version = "0.1.0" }
gens-ai = { path = "crates/gens-ai", version = "0.1.0" }
gens-scripting = { path = "crates/gens-scripting", version = "0.1.0" }
gens-assets = { path = "crates/gens-assets", version = "0.1.0" }
gens-networking = { path = "crates/gens-networking", version = "0.1.0" }
gens-profiler = { path = "crates/gens-profiler", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Enforced as `-D warnings` by CI and scripts/verify.sh.

# Phase 8 build pipeline: line-tables-only debuginfo for the dev profile.
# Full debuginfo on the 16-crate workspace (wgpu+egui+rhai+quinn linked by
# examples) overflows 10 GB sandboxes during verify.sh (R-02x: ENOSPC /
# linker Bus error twice this phase). Line tables keep backtraces
# symbolized, cut target/ roughly in half, and change nothing at runtime;
# the ADR-0012 debug binary-size gate is re-baselined honestly in
# docs/PHASE_8_REPORT.md.
[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
